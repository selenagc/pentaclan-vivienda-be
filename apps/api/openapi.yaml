openapi: 3.0.3
info:
  title: Pentaclan Vivienda API
  version: 0.1.0
  description: Backend REST API for Pentaclan Vivienda.
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Proyectos
  - name: Geografia
    description: Catalogo geografico de Bolivia (datos maestros, solo lectura).
  - name: Entidades publicas
    description: Catalogo de entidades publicas por departamento (datos maestros, solo lectura).

paths:
  /health:
    get:
      tags: [Health]
      summary: Service health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status: { type: string, example: ok }
                          uptime: { type: number, example: 123.456 }
                          timestamp: { type: string, format: date-time }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/User' }
                      accessToken: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the authenticated user profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users:
    get:
      tags: [Users]
      summary: List users (paginated) — admin only
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [name, email, role, createdAt]
            default: createdAt
        - in: query
          name: sortOrder
          schema: { type: string, enum: [asc, desc], default: desc }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: role
          schema: { $ref: '#/components/schemas/Role' }
      responses:
        '200':
          description: Paginated list of users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      summary: Create a user — admin only
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUser' }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/me:
    patch:
      tags: [Users]
      summary: Update own profile (cannot change role)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMe' }
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Users]
      summary: Get a user by id — admin only
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Users]
      summary: Update a user — admin only
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUser' }
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Users]
      summary: Delete a user — admin only
      security:
        - BearerAuth: []
      responses:
        '204':
          description: User deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /proyectos:
    get:
      tags: [Proyectos]
      summary: Listar proyectos (paginado)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [nombre, nroContrato, createdAt]
            default: createdAt
        - in: query
          name: sortOrder
          schema: { type: string, enum: [asc, desc], default: desc }
        - in: query
          name: search
          description: Busca en nombre y nro de contrato
          schema: { type: string }
        - in: query
          name: entidadPublicaId
          schema: { type: integer, minimum: 1 }
        - in: query
          name: usuarioId
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Lista paginada de proyectos
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Proyecto' }
                  meta:
                    type: object
                    properties:
                      page: { type: integer }
                      limit: { type: integer }
                      total: { type: integer }
                      totalPages: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Proyectos]
      summary: Registrar un proyecto — admin only
      description: >-
        El creador (`usuarioId`) se toma del token, nunca del cuerpo. Enviarlo
        explicitamente devuelve 400. Solo el rol `admin` puede crear proyectos:
        cualquier otro rol autenticado recibe 403.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProyecto' }
      responses:
        '201':
          description: Proyecto creado
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Proyecto' }
                  message: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: La entidad publica financiadora no existe
        '409': { $ref: '#/components/responses/Conflict' }

  /proyectos/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Proyectos]
      summary: Obtener un proyecto por su ID
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Proyecto encontrado
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Proyecto' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Proyectos]
      summary: Actualizar un proyecto — admin only
      description: >-
        `usuarioId` no es editable: es dato de auditoria. Enviarlo devuelve 400.
        Solo el rol `admin` puede actualizar: cualquier otro rol autenticado
        recibe 403.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProyecto' }
      responses:
        '200':
          description: Proyecto actualizado
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Proyecto' }
                  message: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /departamentos:
    get:
      tags: [Geografia]
      summary: Listar los departamentos del catalogo
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lista de departamentos ordenada por nombre
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Departamento' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /departamentos/{id}/provincias:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [Geografia]
      summary: Listar las provincias de un departamento
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Provincias del departamento indicado
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Provincia' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /provincias/{id}/municipios:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [Geografia]
      summary: Listar los municipios de una provincia
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Municipios de la provincia indicada
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Municipio' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /entidades:
    get:
      tags: [Entidades publicas]
      summary: Listar las entidades publicas del catalogo
      description: >-
        Catalogo de solo lectura cargado por seeder (PV-19). No existen
        operaciones POST/PUT/PATCH/DELETE.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lista de entidades ordenada por sigla
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/EntidadPublica' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /entidades/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [Entidades publicas]
      summary: Obtener una entidad publica por su ID
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Entidad publica encontrada
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/EntidadPublica' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SuccessEnvelope:
      type: object
      required: [success]
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data: {}
    PaginatedEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: {}
        meta:
          type: object
          properties:
            page: { type: integer }
            limit: { type: integer }
            total: { type: integer }
            totalPages: { type: integer }
    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
    Role:
      type: string
      enum: [admin, social_lead, technical_lead, project_supervisor]
    Departamento:
      type: object
      required: [id, nombre]
      properties:
        id: { type: integer, example: 1 }
        nombre: { type: string, example: La Paz }
    Provincia:
      type: object
      required: [id, nombre, departamentoId]
      properties:
        id: { type: integer, example: 10 }
        nombre: { type: string, example: Murillo }
        departamentoId: { type: integer, example: 1 }
    Municipio:
      type: object
      required: [id, nombre, provinciaId]
      properties:
        id: { type: integer, example: 100 }
        nombre: { type: string, example: El Alto }
        provinciaId: { type: integer, example: 10 }
    EntidadPublica:
      type: object
      required: [id, nit, nombre, sigla]
      properties:
        id: { type: integer, example: 1 }
        # Clave natural: cada entidad tiene un unico NIT institucional.
        nit: { type: integer, format: int64, example: 192310023 }
        nombre: { type: string, example: Agencia Estatal de Vivienda }
        sigla: { type: string, example: AEVIVIENDA }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateUser:
      type: object
      required: [name, email, password, role]
      properties:
        name: { type: string, maxLength: 150 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128 }
        role: { $ref: '#/components/schemas/Role' }
    UpdateUser:
      type: object
      minProperties: 1
      properties:
        name: { type: string, maxLength: 150 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128 }
        role: { $ref: '#/components/schemas/Role' }
    UpdateMe:
      type: object
      minProperties: 1
      properties:
        name: { type: string, maxLength: 150 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128 }
    Proyecto:
      type: object
      required: [id, nombre, nroContrato, entidadPublicaId, usuarioNombre]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string, example: Construccion de viviendas sociales - Fase I }
        nroContrato: { type: string, example: AEV-2026-0042 }
        entidadPublicaId: { type: integer, example: 2 }
        # Nombre del usuario que registro el proyecto. Se toma de la sesion y no
        # es editable. El id del creador no se expone: para filtrar por el se usa
        # el query param `usuarioId` de GET /proyectos.
        usuarioNombre: { type: string, example: Selena Gutierrez }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateProyecto:
      type: object
      required: [nombre, nroContrato, entidadPublicaId]
      properties:
        nombre: { type: string, maxLength: 200 }
        nroContrato: { type: string, maxLength: 50 }
        entidadPublicaId: { type: integer, minimum: 1 }
    UpdateProyecto:
      type: object
      minProperties: 1
      properties:
        nombre: { type: string, maxLength: 200 }
        nroContrato: { type: string, maxLength: 50 }
        entidadPublicaId: { type: integer, minimum: 1 }


  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
