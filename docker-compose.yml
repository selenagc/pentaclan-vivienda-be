services:
  mariadb:
    image: mariadb:11.4
    container_name: pentaclan-mariadb
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MARIADB_DATABASE: ${DB_NAME:-pentaclan_vivienda}
      MARIADB_USER: ${DB_USER:-pentaclan}
      MARIADB_PASSWORD: ${DB_PASSWORD:-pentaclan}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mariadb_data:
